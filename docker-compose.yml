# Cały Wykrojnik na własnym komputerze pod adresem http://localhost:8080 (strona, render w Blenderze, pytania do Claude'a własnym kluczem).
# Uruchomienie: docker compose up --build
services:
  wykrojnik:
    build: .
    platform: linux/amd64   # moduł bpy dla Linuksa jest tylko w tej wersji; na Macu z procesorem Apple działa przez emulację, czyli wolniej
    ports: ["8080:8080"]
    env_file: [{ path: .env, required: false }]
    volumes:
      - dane:/dane
    restart: unless-stopped
volumes:
  dane:
